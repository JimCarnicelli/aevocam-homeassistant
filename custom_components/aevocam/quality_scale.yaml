# Progress tracker for Core quality-scale work.
# This file does not declare a tier by itself. A Core manifest would set
# "quality_scale": "bronze" only when submitting / grading in Core.

rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: exempt
    comment: Integration does not poll; uploads run on button press.
  brands:
    status: todo
    comment: Local brand icons exist; still need a home-assistant/brands PR for Core.
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency:
    status: todo
    comment: pyaevocam is vendored; must be published to PyPI for Core.
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-conditions:
    status: exempt
    comment: Integration does not register custom conditions.
  docs-high-level-description:
    status: todo
    comment: Needs a home-assistant.io integration page.
  docs-installation-instructions:
    status: todo
    comment: Needs a home-assistant.io integration page.
  docs-removal-instructions:
    status: todo
    comment: Needs a home-assistant.io integration page.
  docs-triggers:
    status: exempt
    comment: Integration does not register custom triggers.
  entity-event-setup:
    status: exempt
    comment: Integration does not subscribe to entity events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: todo
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Cloud service integration; no network discovery info to update.
  discovery:
    status: exempt
    comment: Cloud service integration; no local device discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Integration maps a single configured camera to a feed.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: Integration does not manage a dynamic set of devices.

  # Platinum
  async-dependency: todo
  inject-websession: todo
  strict-typing: todo
